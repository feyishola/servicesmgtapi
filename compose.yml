# Full stack: docker compose up --build, then seed demo data with
#   docker compose exec api npm run seed
# Web: http://localhost:3000   API: http://localhost:5000

services:
  web:
    build:
      context: ./www/web
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build: ./serviceRenderers
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/service-mgt-app
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-openstreetmap}
      GEOCODER_API_KEY: ${GEOCODER_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongovolume:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mongovolume:
