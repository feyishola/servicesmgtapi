server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routing: unknown paths fall back to the app
  location / {
    try_files $uri /index.html;
  }
}
